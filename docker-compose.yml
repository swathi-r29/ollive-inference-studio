# docker-compose.yml
# One-command setup: docker compose up --build
#
# Services:
#   mongo    — MongoDB 7 with a named volume for persistence
#   backend  — Express API on port 4000
#   frontend — Vite dev server on port 5173 (for dev)
#              In production, replace with an nginx static build

version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: ollive_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ollive_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # Connect directly to MongoDB Atlas
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redis:6379
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:5173
      # Support all providers in production Docker container
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ollive_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend


