apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ollive
data:
  MONGODB_URI: "mongodb://ollive:ollive_secret@mongo:27017/ollive?authSource=admin"
  REDIS_URL: "redis://redis:6379"
  PORT: "4000"
  NODE_ENV: "production"
  FRONTEND_URL: "http://ollive.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ollive
type: Opaque
stringData:
  # Replace with actual API keys or map them via external secrets
  GEMINI_API_KEY: "your-gemini-api-key"
  ANTHROPIC_API_KEY: "your-anthropic-api-key"
  OPENAI_API_KEY: "your-openai-api-key"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ollive
spec:
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ollive
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ollive-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "0.2"
              memory: 256Mi
